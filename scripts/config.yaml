paths:
  liberty: pdk/sky130_fd_sc_hd__tt_025C_1v80.lib
  raw_rtl: dataset/raw_rtl/
  output_dataset: dataset/generated_dataset/timing_dataset.jsonl
  failures_log: dataset/generated_dataset/failures.jsonl
  workdir: dataset/workdir/

tools:
  yosys: yosys
  sta: sta
  # Absolute path: eqy/sby ship in the OSS CAD Suite bundle, which isn't on
  # the default system PATH (yosys/sta above resolve fine via PATH since
  # they're separately installed at /usr/bin and /usr/local/bin).
  eqy: /home/devansh/tools/oss-cad-suite/bin/eqy

synthesis:
  target_clock_ghz: [1.0, 2.0]
  input_delay_fraction: 0.2
  output_delay_fraction: 0.2
  timeout_seconds: 300

mutations:
  enabled:
    - pipeline_insert
    - register_retime
    - expression_balance
    - strength_reduce
  max_per_module: 4

dataset:
  skip_patterns:
    - "*_mon.v"
    - "*_test.v"
    - "*_test_top.v"
    - "sas_*.v"
    - "playback_*.v"
    - "*.t.v"
    # Shared macro/defines header (BaseJump STL), not a synthesizable module
    # itself — its `BSG_ABSTRACT_MODULE macro's literal template text
    # ("module fn``__abstract...") false-matches the module-name discovery
    # regex. Still resolves correctly via `include for the other bsg_*.sv
    # files, since raw_rtl/ is already on the Yosys include search path.
    - "bsg_defines.sv"
